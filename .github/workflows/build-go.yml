name: Build All Branches

on:
  workflow_dispatch:
    inputs:
      build_v189:
        description: 'v1.8.9 branchini build et'
        required: true
        type: boolean
        default: true
      build_v190:
        description: 'v1.9.0 branchini build et'
        required: true
        type: boolean
        default: true

  push:
    branches: [ "cli" ]

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_branch: "v1.8.9"
            version: "1.8.9"
            enable: ${{ inputs.build_v189 == true || github.event_name == 'push' }}
          - target_branch: "v1.9.0"
            version: "1.9.0"
            enable: ${{ inputs.build_v190 == true || github.event_name == 'push' }}

    steps:
    - name: Check if branch is enabled
      if: ${{ matrix.enable == false }}
      run: echo "Bu branch seçilmedi, atlanıyor..."

    - name: Clone and Checkout Branch
      if: ${{ matrix.enable == true }}
      run: |
        git clone --branch ${{ matrix.target_branch }} https://github.com/${{ github.repository }}.git .
      shell: pwsh

    - name: Verify Go Installation
      if: ${{ matrix.enable == true }}
      run: go version
      shell: pwsh

    - name: Tidy Dependencies
      if: ${{ matrix.enable == true }}
      run: go mod tidy
      shell: pwsh

    - name: Set Environment Info
      if: ${{ matrix.enable == true }}
      run: |
        $now = (Get-Date).AddHours(3)
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_ENV
        echo "BUILDSTAMP=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
        echo "TAGNAME=${{ matrix.version }}" >> $env:GITHUB_ENV

    - name: Build Windows Executable
      if: ${{ matrix.enable == true }}
      run: |
        go build -ldflags="-s -w -X 'main.currentVersion=${{ matrix.version }}' -X 'main.buildStamp=${{ env.BUILDSTAMP }}'" -o mesnevi.exe .

    - name: Prepare Release Folder
      if: ${{ matrix.enable == true }}
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\
      shell: pwsh

    - name: Create GitHub Release
      if: ${{ matrix.enable == true }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseBody = @"
        ### Build Details
        - **Build Time:** ${{ env.DATETIME }}
        - **Source Branch:** ${{ matrix.target_branch }}
        - BuildStamp: ${{ env.BUILDSTAMP }}
        "@

        gh release delete "${{ env.TAGNAME }}" --yes 2>$null
        git push origin --delete "${{ env.TAGNAME }}" 2>$null
        $global:LASTEXITCODE = 0

        gh release create "${{ env.TAGNAME }}" --title "Release v${{ env.TAGNAME }} (${{ matrix.target_branch }})" --notes "$releaseBody" release_folder/mesnevi.exe
      shell: pwsh
