name: Auto Update Offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_choice:
        description: 'Hangi kaynak öncelikli olsun?'
        required: true
        default: 'sezzyaep'
        type: choice
        options:
          - 'sezzyaep'
          - 'a2x'
          - 'auto'

jobs:
  update-offsets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository (cli)
        uses: actions/checkout@v4
        with:
          ref: 'cli'
          fetch-depth: 0 # Tüm branch'leri ve geçmişi çekmesini sağlar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Process Offsets
        env:
          CHOICE: ${{ inputs.source_choice || 'sezzyaep' }}
        run: |
          python -c '
          import urllib.request
          import json
          import os

          choice = os.environ.get("CHOICE", "sezzyaep")

          def fetch_json(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return json.loads(response.read().decode())
              except Exception as e:
                  print(f"Failed to fetch {url}: {e}")
                  return None

          def parse_val(val):
              if isinstance(val, dict):
                  return val.get("offset")
              return val

          def get_sezzyaep():
              print("Fetching from sezzyaep...")
              raw_offsets = fetch_json("https://raw.githubusercontent.com/sezzyaep/CS2-OFFSETS/main/offsets.json")
              raw_client = fetch_json("https://raw.githubusercontent.com/sezzyaep/CS2-OFFSETS/main/client_dll.json")
              
              if not raw_offsets:
                  return None

              client_data = raw_client if raw_client else raw_offsets
              classes = client_data.get("client.dll", client_data).get("classes", {})

              def get_field_offset(class_name, field_name):
                  cls_data = classes.get(class_name, {})
                  fields = cls_data.get("fields", {}) if isinstance(cls_data, dict) else {}
                  val = fields.get(field_name)
                  return parse_val(val)

              client_offsets = raw_offsets.get("client.dll", raw_offsets)

              return {
                  "dwViewMatrix": parse_val(client_offsets.get("dwViewMatrix")),
                  "dwLocalPlayerPawn": parse_val(client_offsets.get("dwLocalPlayerPawn")),
                  "dwEntityList": parse_val(client_offsets.get("dwEntityList")),
                  "m_hPlayerPawn": get_field_offset("CCSPlayerController", "m_hPlayerPawn") or parse_val(client_offsets.get("m_hPlayerPawn")),
                  "m_iHealth": get_field_offset("C_BaseEntity", "m_iHealth") or parse_val(client_offsets.get("m_iHealth")),
                  "m_lifeState": get_field_offset("C_BaseEntity", "m_lifeState") or parse_val(client_offsets.get("m_lifeState")),
                  "m_iTeamNum": get_field_offset("C_BaseEntity", "m_iTeamNum") or parse_val(client_offsets.get("m_iTeamNum")),
                  "m_vOldOrigin": get_field_offset("C_BasePlayerPawn", "m_vOldOrigin") or parse_val(client_offsets.get("m_vOldOrigin")),
                  "m_pGameSceneNode": get_field_offset("C_BaseEntity", "m_pGameSceneNode") or parse_val(client_offsets.get("m_pGameSceneNode")),
                  "m_modelState": get_field_offset("CSkeletonInstance", "m_modelState") or parse_val(client_offsets.get("m_modelState")),
                  "m_boneArray": get_field_offset("C_CSGO_PreviewModel", "m_boneArray") or get_field_offset("CModelConfig", "m_boneArray") or parse_val(client_offsets.get("m_boneArray")) or 128,
                  "m_nodeToWorld": get_field_offset("CGameSceneNode", "m_nodeToWorld") or parse_val(client_offsets.get("m_nodeToWorld")),
                  "m_sSanitizedPlayerName": get_field_offset("CCSPlayerController", "m_sSanitizedPlayerName") or parse_val(client_offsets.get("m_sSanitizedPlayerName")),
                  "m_ArmorValue": get_field_offset("CCSPlayerController", "m_ArmorValue") or get_field_offset("C_CSPlayerPawn", "m_ArmorValue") or parse_val(client_offsets.get("m_ArmorValue")),
                  "m_pBulletServices": get_field_offset("C_CSPlayerPawn", "m_pBulletServices") or parse_val(client_offsets.get("m_pBulletServices")),
                  "m_totalHitsOnServer": get_field_offset("CCSPlayerController", "m_totalHitsOnServer") or get_field_offset("CCSPlayer_BulletServices", "m_totalHitsOnServer") or parse_val(client_offsets.get("m_totalHitsOnServer"))
              }

          def get_a2x():
              print("Fetching from a2x...")
              raw_offsets = fetch_json("https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json")
              raw_client = fetch_json("https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/client_dll.json")
              if not raw_offsets or not raw_client:
                  return None

              classes = raw_client.get("client.dll", {}).get("classes", {})
              def get_field_offset(class_name, field_name):
                  fields = classes.get(class_name, {}).get("fields", {})
                  return parse_val(fields.get(field_name))

              return {
                  "dwViewMatrix": parse_val(raw_offsets.get("client.dll", {}).get("dwViewMatrix")),
                  "dwLocalPlayerPawn": parse_val(raw_offsets.get("client.dll", {}).get("dwLocalPlayerPawn")),
                  "dwEntityList": parse_val(raw_offsets.get("client.dll", {}).get("dwEntityList")),
                  "m_hPlayerPawn": get_field_offset("CCSPlayerController", "m_hPlayerPawn"),
                  "m_iHealth": get_field_offset("C_BaseEntity", "m_iHealth"),
                  "m_lifeState": get_field_offset("C_BaseEntity", "m_lifeState"),
                  "m_iTeamNum": get_field_offset("C_BaseEntity", "m_iTeamNum"),
                  "m_vOldOrigin": get_field_offset("C_BasePlayerPawn", "m_vOldOrigin"),
                  "m_pGameSceneNode": get_field_offset("C_BaseEntity", "m_pGameSceneNode"),
                  "m_modelState": get_field_offset("CSkeletonInstance", "m_modelState"),
                  "m_boneArray": get_field_offset("C_CSGO_PreviewModel", "m_boneArray") or get_field_offset("CModelConfig", "m_boneArray") or 128,
                  "m_nodeToWorld": get_field_offset("CGameSceneNode", "m_nodeToWorld"),
                  "m_sSanitizedPlayerName": get_field_offset("CCSPlayerController", "m_sSanitizedPlayerName"),
                  "m_ArmorValue": get_field_offset("CCSPlayerController", "m_ArmorValue") or get_field_offset("C_CSPlayerPawn", "m_ArmorValue"),
                  "m_pBulletServices": get_field_offset("C_CSPlayerPawn", "m_pBulletServices"),
                  "m_totalHitsOnServer": get_field_offset("CCSPlayerController", "m_totalHitsOnServer") or get_field_offset("CCSPlayer_BulletServices", "m_totalHitsOnServer")
              }

          my_offsets = None
          used_source = ""

          if choice == "sezzyaep":
              my_offsets = get_sezzyaep()
              used_source = "sezzyaep"
          elif choice == "a2x":
              my_offsets = get_a2x()
              used_source = "a2x"
          else:
              my_offsets = get_sezzyaep()
              used_source = "sezzyaep"
              if not my_offsets or not any(my_offsets.values()):
                  print("sezzyaep failed, fallback to a2x...")
                  my_offsets = get_a2x()
                  used_source = "a2x"

          if my_offsets and any(my_offsets.values()):
              print(f"Successfully processed offsets using source: {used_source}")
              with open("new_offsets.json", "w", encoding="utf-8") as f:
                  json.dump(my_offsets, f, indent=4)
          else:
              print("Error: Failed to fetch offsets from selected source.")
              exit(1)
          '

      - name: Update Offsets Across All Target Branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Tüm uzak branch bilgilerini güncelle
          git fetch origin
          
          # Güncellenecek tüm branch'lerin listesi
          branches=("v1.8.3main" "v1.8.2old" "v1.8.4neon")

          for branch in "${branches[@]}"; do
            echo "Processing branch: $branch"
            git checkout "$branch" || git checkout -b "$branch" origin/"$branch"
            
            # Yeni offsets dosyasını kopyala
            cp new_offsets.json offsets.json
            
            # Git'e dosyayı ekle (Eğer içerik aynıysa hata vermemesi için zorlayabiliriz veya add edebiliriz)
            git add offsets.json
            
            # Eğer staged alanında değişiklik varsa commit at ve push'la
            if ! git diff --cached --quiet; then
              echo "Changes detected in $branch, committing..."
              git commit -m "chore: auto-update offsets.json for $branch"
              git push origin "$branch"
            else
              echo "No changes needed for $branch."
            fi
          done

          # Temizlik
          rm -f new_offsets.json

          echo "Triggering central build-go.yml workflow..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-go.yml/dispatches \
            -d '{"ref":"cli"}'
