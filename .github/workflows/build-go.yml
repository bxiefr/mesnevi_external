name: Build All Branches

on:
  workflow_dispatch:
  push:
    branches: [ "cli" ]

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch: ["v1.8.5main", "v1.8.6neon"]

    steps:
    - name: Checkout Target Branch (${{ matrix.target_branch }})
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.target_branch }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get current date, time and source info
      run: |
        $now = (Get-Date).AddHours(3)
        echo "DATE=$($now.ToString('yyyyMMdd'))" >> $env:GITHUB_ENV
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_ENV
        echo "TAGNAME=v$($now.ToString('yyyyMMdd-HHmmss'))-${{ matrix.target_branch }}" >> $env:GITHUB_ENV

    - name: Build Windows Executable
      run: |
        go build -o mesnevi.exe .

    - name: Prepare Release Folder
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mesnevi-${{ env.DATE }}-${{ matrix.target_branch }}
        path: release_folder/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAGNAME }}
        name: Build ${{ env.DATETIME }} (${{ matrix.target_branch }})
        body: |
          ### Build Details
          - **Build Time:** ${{ env.DATETIME }}
          - **Source Branch:** `${{ matrix.target_branch }}`
          - **Status:** Automated CLI Build
        files: |
          release_folder/mesnevi.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
