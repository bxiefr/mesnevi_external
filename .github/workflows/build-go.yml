name: Build All Branches (Pure CLI)

on:
  workflow_dispatch:
    inputs:
      build_v187:
        description: 'v1.8.7main branchini build et'
        required: true
        type: boolean
        default: true
      build_v188:
        description: 'v1.8.8neon branchini build et'
        required: true
        type: boolean
        default: true

  push:
    branches: [ "cli" ]

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_branch: "v1.8.7main"
            enable: ${{ inputs.build_v187 == true || github.event_name == 'push' }}
          - target_branch: "v1.8.8neon"
            enable: ${{ inputs.build_v188 == true || github.event_name == 'push' }}

    steps:
    - name: Check if branch is enabled
      if: ${{ matrix.enable == false }}
      run: echo "Bu branch secilmedi, atlanıyor..."

    - name: Clone and Checkout Branch
      if: ${{ matrix.enable == true }}
      run: |
        git clone --branch ${{ matrix.target_branch }} https://github.com/${{ github.repository }}.git .
      shell: pwsh

    - name: Verify Go Installation
      if: ${{ matrix.enable == true }}
      run: |
        go version
      shell: pwsh

    - name: Tidy Dependencies
      if: ${{ matrix.enable == true }}
      run: go mod tidy
      shell: pwsh

    - name: Get current date, time and source info
      if: ${{ matrix.enable == true }}
      run: |
        $now = (Get-Date).AddHours(3)
        $timestamp = $now.ToString('yyyyMMddHHmmss')
        $branchTag = "${{ matrix.target_branch }}-$timestamp"
        
        echo "DATE=$($now.ToString('yyyyMMdd'))" >> $env:GITHUB_ENV
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_ENV
        echo "TAGNAME=$branchTag" >> $env:GITHUB_ENV
        echo "PURE_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build Windows Executable
      if: ${{ matrix.enable == true }}
      run: |
        go build -ldflags="-s -w -X 'main.currentVersion=${{ env.PURE_TIMESTAMP }}'" -o mesnevi.exe .
      shell: pwsh

    - name: Prepare Release Folder
      if: ${{ matrix.enable == true }}
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\
      shell: pwsh

    - name: Create GitHub Release via Native GH CLI
      if: ${{ matrix.enable == true }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseBody = "### Build Details`n- **Build Time:** ${{ env.DATETIME }}`n- **Source Branch:** `${{ matrix.target_branch }}` `n- **Status:** Automated Native CLI Build"
        
        gh release create "${{ env.TAGNAME }}" `
          --title "Build ${{ env.DATETIME }} (${{ matrix.target_branch }})" `
          --notes "$releaseBody" `
          release_folder/mesnevi.exe
      shell: pwsh
