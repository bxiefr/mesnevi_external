.scenery {

.sun {

    left: 50%;

    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun-core) 0%, var(--sun-edge) 62%, transparent 72%);
    box-shadow: 0 0 120px 40px var(--glow);
    animation: sunrise 14s ease-in-out infinite alternate;
}

.sun-haze {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 55%;
    background: radial-gradient(ellipse at 50% 100%, var(--glow), transparent 65%);
}

.stars {
    position: absolute;
    inset: 0 0 45% 0;
    background-image:

        radial-gradient(1px 1px at 28% 8%, #fff, transparent),

    animation: twinkle 5s ease-in-out infinite alternate;
    transition: opacity 0.6s;

}

@keyframes twinkle {

function computeAutoTheme() {
    const hour = new Date().getHours();
    return (hour >= 6 && hour < 18) ? "golden" : "dusk";
}

const state = {
    lang: readStorage("lang") === "en" ? "en" : "tr",
    themeMode: readStorage("theme") ? "manual" : "auto",
    theme: readStorage("theme") || computeAutoTheme(),
    branches: null,
    branchError: false,
    offsetDate: undefined
};

function readStorage(key) {
    try {
        return localStorage.getItem(key);
    } catch {
        return null;
    }
}

function writeStorage(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch {}
}

function t(key) {
    return DICT[state.lang][key];
}

function formatFullDate(isoString) {
    const date = new Date(isoString);
    if (Number.isNaN(date.getTime())) return null;
    return new Intl.DateTimeFormat(t("locale"), {
        timeZone: TIME_ZONE,
        dateStyle: "full",
        timeStyle: "long"
    }).format(date);
}

function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function renderStatic() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = t(node.dataset.i18n);
    });
    document.getElementById("langLabel").textContent = state.lang === "tr" ? "EN" : "TR";
}

function renderTheme() {
    if (state.themeMode === "auto") state.theme = computeAutoTheme();
    document.documentElement.dataset.theme = state.theme;
    const dusk = state.theme === "dusk";
    document.getElementById("themeIcon").textContent = dusk ? "🌇" : "🌅";
    const label = dusk ? t("themeDusk") : t("themeGolden");
    document.getElementById("themeLabel").textContent = state.themeMode === "auto" ? label + t("autoSuffix") : label;
}

function renderOffset() {
    const target = document.getElementById("offsetValue");
    if (state.offsetDate === undefined) {
        target.textContent = t("loading");
        return;
    }
    const formatted = state.offsetDate ? formatFullDate(state.offsetDate) : null;
    target.textContent = formatted || t("unknownDate");
}

function renderBranches() {
    const container = document.getElementById("branches");
    container.replaceChildren();

    if (state.branchError) {
        container.append(element("div", "notice error", t("fetchError")));
        return;
    }
    if (!state.branches) {
        container.append(element("div", "notice", t("githubLoading")));
        return;
    }

    state.branches.forEach(branch => {
        const card = element("div", "branch");
        const meta = element("div", "branch-meta");
        const title = element("div", "branch-title", `🌿 ${branch.name}`);
        if (branch.name === DEFAULT_BRANCH) title.append(element("span", "tag", t("tagDefault")));

        const formatted = branch.date ? formatFullDate(branch.date) : null;
        meta.append(title, element("div", "branch-time", `${t("lastUpdate")} ${formatted || t("unknownDate")}`));

        const link = element("a", "btn");
        link.href = `https://github.com/${OWNER}/${REPO}/tree/${encodeURIComponent(branch.name)}`;
        link.target = "_blank";
        link.rel = "noopener";
        link.append(element("span", "", "📦"), document.createTextNode(` ${t("inspectDownload")}`));

        card.append(meta, link);
        container.append(card);
    });
}

function renderFaq() {
    const list = document.getElementById("faqList");
    list.replaceChildren();
    t("faq").forEach(item => {
        const entry = element("details", "faq");
        entry.append(element("summary", "", item.q), element("p", "", item.a));
        list.append(entry);
    });
}

function renderDownloadLinks() {
    document.getElementById("downloadMain").href = zipUrl(DEFAULT_BRANCH);
    document.getElementById("downloadNeon").href = zipUrl(NEON_BRANCH);
}

function renderAll() {
    renderStatic();
    renderTheme();
    renderDownloadLinks();
    renderFaq();
    renderOffset();
    renderBranches();
}

async function fetchJson(url) {
    const response = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
}

async function loadFromStatusFile() {
    const response = await fetch(STATUS_URL, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data.branches)) throw new Error("invalid status.json");

    state.branches = data.branches
        .filter(branch => !HIDDEN_BRANCHES.includes(branch.name))
        .map(branch => ({ name: branch.name, date: branch.updated_at || null }));
    state.branches.sort((a, b) => (b.name === DEFAULT_BRANCH) - (a.name === DEFAULT_BRANCH));
    state.branchError = false;
    state.offsetDate = Object.prototype.hasOwnProperty.call(data, "offset_sync") ? data.offset_sync : null;
}

async function loadBranchesFromApi() {
    try {
        const list = await fetchJson(`${API}/branches`);
        const visible = list.filter(branch => !HIDDEN_BRANCHES.includes(branch.name));
        state.branches = await Promise.all(visible.map(async branch => {
            try {
                const commit = await fetchJson(branch.commit.url);
                return { name: branch.name, date: commit.commit.committer.date };
            } catch {
                return { name: branch.name, date: null };
            }
        }));
        state.branches.sort((a, b) => (b.name === DEFAULT_BRANCH) - (a.name === DEFAULT_BRANCH));
        state.branchError = false;
    } catch {
        state.branchError = true;
    }
}

async function loadOffsetFromApi() {
    try {
        const commits = await fetchJson(`${API}/commits?path=offsets.json&sha=${encodeURIComponent(DEFAULT_BRANCH)}&per_page=1`);
        state.offsetDate = commits.length ? commits[0].commit.committer.date : null;
    } catch {
        state.offsetDate = null;
    }
}

async function loadRepoData() {
    try {
        await loadFromStatusFile();
    } catch {
        await Promise.all([loadBranchesFromApi(), loadOffsetFromApi()]);
    }
    renderBranches();
    renderOffset();
}

document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "tr" ? "en" : "tr";
    writeStorage("lang", state.lang);
    renderAll();
});

document.getElementById("themeBtn").addEventListener("click", () => {
    state.themeMode = "manual";
    state.theme = state.theme === "dusk" ? "golden" : "dusk";
    writeStorage("theme", state.theme);
    renderTheme();
});

setInterval(() => {
    if (state.themeMode === "auto") renderTheme();
}, 10 * 60 * 1000);

function setupReveal() {
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
        });
    }, { threshold: 0.12 });

    document.querySelectorAll(".hero > *, .stat-card, .panel").forEach((node, index) => {
        node.classList.add("reveal");
        node.style.setProperty("--delay", `${(index % 3) * 0.12}s`);
        observer.observe(node);
    });
}

function setupMenuSpy() {
    const links = document.querySelectorAll(".menu a");
    const spy = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            links.forEach(link => {
                link.classList.toggle("active", link.getAttribute("href") === `#${entry.target.id}`);
            });
        });
    }, { rootMargin: "-40% 0px -55% 0px" });

    document.querySelectorAll("section[id]").forEach(section => spy.observe(section));
}

renderAll();
setupReveal();
setupMenuSpy();
loadRepoData();
</script>
