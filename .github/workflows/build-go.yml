name: Build All Branches

on:
  workflow_dispatch:
    inputs:
      build_v189:
        description: 'v1.8.9 branchini build et'
        required: true
        type: boolean
        default: true
      build_v190:
        description: 'v1.9.0 branchini build et'
        required: true
        type: boolean
        default: true

  push:
    branches: [ "cli" ]

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_branch: "v1.8.9"
            version: "1.8.9"
            enable: ${{ inputs.build_v189 == true || github.event_name == 'push' }}
          - target_branch: "v1.9.0"
            version: "1.9.0"
            enable: ${{ inputs.build_v190 == true || github.event_name == 'push' }}

    steps:
    - name: Check if branch is enabled
      if: ${{ matrix.enable == false }}
      run: echo "Bu branch seçilmedi, atlanıyor..."

    - name: Clone and Checkout Branch
      if: ${{ matrix.enable == true }}
      run: |
        git clone --branch ${{ matrix.target_branch }} https://github.com/${{ github.repository }}.git .
      shell: pwsh

    - name: Setup MSYS2 (MinGW GCC)
      if: ${{ matrix.enable == true }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        release: false
        update: false
        install: mingw-w64-x86_64-gcc

    - name: Add MinGW to PATH
      if: ${{ matrix.enable == true }}
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Verify Go and GCC
      if: ${{ matrix.enable == true }}
      run: |
        go version
        gcc --version
      shell: pwsh

    - name: Pin cimgui-go version
      if: ${{ matrix.enable == true }}
      env:
        # Kodun calistigi son tarih (YYYY-MM-DD). Gerekirse degistir.
        CIMGUI_BEFORE: "2024-06-01"
      run: |
        git clone https://github.com/AllenDang/cimgui-go.git "$env:RUNNER_TEMP\cimgui"
        $sha = git -C "$env:RUNNER_TEMP\cimgui" rev-list -n 1 --before="$env:CIMGUI_BEFORE" origin/main
        echo "Kilitlenen commit: $sha"
        go get "github.com/AllenDang/cimgui-go@$sha"
        go mod tidy
      shell: pwsh

    - name: Set Environment Info
      if: ${{ matrix.enable == true }}
      run: |
        $now = (Get-Date).AddHours(3)
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "BUILDSTAMP=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "TAGNAME=${{ matrix.version }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh

    - name: Build Windows Executable
      if: ${{ matrix.enable == true }}
      env:
        CGO_ENABLED: "1"
        CC: gcc
        CXX: g++
      run: |
        $ldflags = "-s -w -X main.currentVersion=${{ matrix.version }} -X main.buildStamp=${{ env.BUILDSTAMP }} -extldflags '-static -static-libgcc -static-libstdc++'"
        go build -ldflags $ldflags -o mesnevi.exe .
      shell: pwsh

    - name: Check DLL Dependencies
      if: ${{ matrix.enable == true }}
      continue-on-error: true
      run: objdump -p mesnevi.exe | Select-String "DLL Name"
      shell: pwsh

    - name: Prepare Release Folder
      if: ${{ matrix.enable == true }}
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\
      shell: pwsh

    - name: Create GitHub Release
      if: ${{ matrix.enable == true }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $releaseBody = @"
        ### Build Details
        - **Build Time:** ${{ env.DATETIME }}
        - **Source Branch:** ${{ matrix.target_branch }}
        - BuildStamp: ${{ env.BUILDSTAMP }}
        "@

        gh release delete "${{ env.TAGNAME }}" --yes 2>$null
        git push origin --delete "${{ env.TAGNAME }}" 2>$null
        $global:LASTEXITCODE = 0

        gh release create "${{ env.TAGNAME }}" --title "Release v${{ env.TAGNAME }} (${{ matrix.target_branch }})" --notes "$releaseBody" release_folder/mesnevi.exe
      shell: pwsh
