name: Build Go Executable

on:
  workflow_dispatch:
  push:
    branches: [ "v1.8.3main", "v1.8.2old", "v1.8.4neon" ]
  pull_request:
    branches: [ "v1.8.3main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get current date, time and source info
      run: |
        $now = (Get-Date).AddHours(3)
        echo "DATE=$($now.ToString('yyyyMMdd'))" >> $env:GITHUB_ENV
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_ENV
        echo "TAGNAME=v$($now.ToString('yyyyMMdd-HHmmss'))" >> $env:GITHUB_ENV
        
        $content = Get-Content offsets.json -Raw
        echo "SOURCENOTE=Multi-Source Auto Build" >> $env:GITHUB_ENV

    - name: Build Windows Executable
      run: |
        go build -o mesnevi.exe .

    - name: Prepare Release Folder
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mesnevi-${{ env.DATE }}-${{ github.ref_name }}
        path: release_folder/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAGNAME }}
        name: Build ${{ env.DATETIME }} (${{ github.ref_name }})
        body: |
          ### Build Details
          - **Build Time (UTC+3):** ${{ env.DATETIME }}
          - **Source Branch:** `${{ github.ref_name }}`
          - **Status:** Stable / Automated
        files: |
          release_folder/mesnevi.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
