name: Auto Update Offsets

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_choice:
        description: 'Hangi kaynak öncelikli olsun?'
        required: true
        default: 'sezzyaep'
        type: choice
        options:
          - 'sezzyaep'
          - 'a2x'
          - 'auto'

jobs:
  update-offsets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Process Offsets
        env:
          CHOICE: ${{ inputs.source_choice || 'sezzyaep' }}
        run: |
          python -c '
          import urllib.request
          import json
          import os

          choice = os.environ.get("CHOICE", "sezzyaep")

          def fetch_json(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return json.loads(response.read().decode())
              except Exception as e:
                  print(f"Failed to fetch {url}: {e}")
                  return None

          def get_sezzyaep():
              print("Fetching from sezzyaep...")
              data = fetch_json("https://raw.githubusercontent.com/sezzyaep/CS2-OFFSETS/main/offsets.json")
              if not data:
                  return None
              
              # sezzyaep doğrudan client.dll altındaki veya doğrudan anahtarları döner
              client_offsets = data.get("client.dll", data)
              
              return {
                  "dwViewMatrix": client_offsets.get("dwViewMatrix"),
                  "dwLocalPlayerPawn": client_offsets.get("dwLocalPlayerPawn"),
                  "dwEntityList": client_offsets.get("dwEntityList"),
                  "m_hPlayerPawn": client_offsets.get("m_hPlayerPawn"),
                  "m_iHealth": client_offsets.get("m_iHealth"),
                  "m_lifeState": client_offsets.get("m_lifeState"),
                  "m_iTeamNum": client_offsets.get("m_iTeamNum"),
                  "m_vOldOrigin": client_offsets.get("m_vOldOrigin"),
                  "m_pGameSceneNode": client_offsets.get("m_pGameSceneNode"),
                  "m_modelState": client_offsets.get("m_modelState"),
                  "m_boneArray": client_offsets.get("m_boneArray", 128),
                  "m_nodeToWorld": client_offsets.get("m_nodeToWorld"),
                  "m_sSanitizedPlayerName": client_offsets.get("m_sSanitizedPlayerName"),
                  "m_ArmorValue": client_offsets.get("m_ArmorValue"),
                  "m_pBulletServices": client_offsets.get("m_pBulletServices"),
                  "m_totalHitsOnServer": client_offsets.get("m_totalHitsOnServer")
              }

          def get_a2x():
              print("Fetching from a2x...")
              raw_offsets = fetch_json("https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/offsets.json")
              raw_client = fetch_json("https://raw.githubusercontent.com/a2x/cs2-dumper/main/output/client_dll.json")
              if not raw_offsets or not raw_client:
                  return None

              classes = raw_client.get("client.dll", {}).get("classes", {})
              def get_field_offset(class_name, field_name):
                  fields = classes.get(class_name, {}).get("fields", {})
                  return fields.get(field_name)

              return {
                  "dwViewMatrix": raw_offsets.get("client.dll", {}).get("dwViewMatrix"),
                  "dwLocalPlayerPawn": raw_offsets.get("client.dll", {}).get("dwLocalPlayerPawn"),
                  "dwEntityList": raw_offsets.get("client.dll", {}).get("dwEntityList"),
                  "m_hPlayerPawn": get_field_offset("CCSPlayerController", "m_hPlayerPawn"),
                  "m_iHealth": get_field_offset("C_BaseEntity", "m_iHealth"),
                  "m_lifeState": get_field_offset("C_BaseEntity", "m_lifeState"),
                  "m_iTeamNum": get_field_offset("C_BaseEntity", "m_iTeamNum"),
                  "m_vOldOrigin": get_field_offset("C_BasePlayerPawn", "m_vOldOrigin"),
                  "m_pGameSceneNode": get_field_offset("C_BaseEntity", "m_pGameSceneNode"),
                  "m_modelState": get_field_offset("CSkeletonInstance", "m_modelState"),
                  "m_boneArray": get_field_offset("C_CSGO_PreviewModel", "m_boneArray") or get_field_offset("CModelConfig", "m_boneArray") or 128,
                  "m_nodeToWorld": get_field_offset("CGameSceneNode", "m_nodeToWorld"),
                  "m_sSanitizedPlayerName": get_field_offset("CCSPlayerController", "m_sSanitizedPlayerName"),
                  "m_ArmorValue": get_field_offset("CCSPlayerController", "m_ArmorValue") or get_field_offset("C_CSPlayerPawn", "m_ArmorValue"),
                  "m_pBulletServices": get_field_offset("C_CSPlayerPawn", "m_pBulletServices"),
                  "m_totalHitsOnServer": get_field_offset("CCSPlayerController", "m_totalHitsOnServer")
              }

          my_offsets = None
          used_source = ""

          if choice == "sezzyaep":
              my_offsets = get_sezzyaep()
              used_source = "sezzyaep"
          elif choice == "a2x":
              my_offsets = get_a2x()
              used_source = "a2x"
          else: # auto
              my_offsets = get_sezzyaep()
              used_source = "sezzyaep"
              if not my_offsets or not any(my_offsets.values()):
                  print("sezzyaep failed, fallback to a2x...")
                  my_offsets = get_a2x()
                  used_source = "a2x"

          if my_offsets and any(my_offsets.values()):
              print(f"Successfully processed offsets using source: {used_source}")
              with open("offsets.json", "w", encoding="utf-8") as f:
                  json.dump(my_offsets, f, indent=4)
          else:
              print("Error: Failed to fetch offsets from selected source.")
              exit(1)
          '

      - name: Commit, Push and Trigger Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git status --porcelain | grep -q "offsets.json"; then
            echo "Offset changes detected, committing updates..."
            git add offsets.json
            git commit -m "chore: fix sezzyaep offset parsing and update"
            git push

            echo "Triggering build-go.yml workflow..."
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-go.yml/dispatches \
              -d '{"ref":"main"}'
          else
            echo "Offsets are already up to date, no changes detected."
          fi
