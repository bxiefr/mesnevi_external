name: Build Go Executable

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get current date, time and source info
      run: |
        $now = (Get-Date).AddHours(3)
        echo "DATE=$($now.ToString('yyyyMMdd'))" >> $env:GITHUB_ENV
        echo "DATETIME=$($now.ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_ENV
        echo "TAGNAME=v$($now.ToString('yyyyMMdd-HHmmss'))" >> $env:GITHUB_ENV
        
        # offsets.json içeriğine bakarak hangi kaynaktan alındığını anlama
        $content = Get-Content offsets.json -Raw
        # Eğer sezzyaep düz anahtar yapıdaysa veya dumper izi varsa etiket belirle
        echo "SOURCENOTE=Multi-Source Auto Build" >> $env:GITHUB_ENV

    - name: Build Windows Executable
      run: |
        go build -o mesnevi.exe main.go memory.go

    - name: Prepare Release Folder
      run: |
        mkdir release_folder
        copy mesnevi.exe release_folder\
        copy hit.wav release_folder\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mesnevi-${{ env.DATE }}
        path: release_folder/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAGNAME }}
        name: Build ${{ env.DATETIME }}
        body: ${{ env.DATETIME }}
        files: |
          release_folder/mesnevi.exe
          release_folder/hit.wav
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
